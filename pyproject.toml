[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voltage-verify"
version = "0.2.1"
description = "Bind an Intel TDX quote and an NVIDIA GPU attestation to the workload you meant to run, then verify the bundle without trusting the cloud provider."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "VoltageGPU (VOLTAGE EI)", email = "contact@voltagegpu.com" }]
keywords = ["confidential-computing", "intel-tdx", "nvidia", "attestation", "remote-attestation", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security :: Cryptography",
]
# Lower bounds stay compatible with nv-attestation-sdk 2.7.x, which pins cryptography==43.0.1
# and PyJWT 2.7, so that the [attest] extra installs in one environment on the VM. No upper
# bound on cryptography: the verifier machine should get the latest release (security fixes
# in the X.509 and ASN.1 code paths matter here); 0.1.1 is tested against 43.0.1 and 50.0.1.
dependencies = [
  "cryptography>=42",
  "PyJWT>=2.7,<3",
]

[project.optional-dependencies]
# Only needed on the attested VM, to talk to the NVIDIA GPU and to NRAS.
attest = ["nv-attestation-sdk>=2.7", "nvidia-ml-py>=12"]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
voltage-verify = "voltage_verify.cli:main"

[project.urls]
Homepage = "https://voltagegpu.com/blog/two-proofs-tdx-nvidia-h200-attestation-tenant"
Documentation = "https://docs.voltagegpu.com/pods/confidential-vm"
Source = "https://github.com/Jabsama/voltage-verify"
Issues = "https://github.com/Jabsama/voltage-verify/issues"
Changelog = "https://github.com/Jabsama/voltage-verify/blob/main/CHANGELOG.md"
Mirror = "https://voltagegpu.com/blog/two-proofs/voltage-verify/"
Evidence = "https://voltagegpu.com/blog/two-proofs/evidence/README.txt"

[tool.hatch.build.targets.wheel]
packages = ["src/voltage_verify"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
# S101: asserts are fine in tests. S310: every urlopen in this package targets a constant
# https:// endpoint (Intel PCS, NVIDIA NRAS) or a registry URL built from an https scheme.
ignore = ["S101", "S310", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
